name: tests

on:
  pull_request:
    branches: [main, master]

jobs:
  video-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start server
        run: docker compose up --build -d

      - name: Wait for Triton server to be ready
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:18000/v2/health/ready; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run tests
        run: uv run pytest tests/test_video_ocr.py
        env:
          SERVER_URL: 0.0.0.0:18000
          VIDEO_PATH: /home/d.kurtaev/car.mp4
