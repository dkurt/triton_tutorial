name: tests

on:
  pull_request:
    branches: [main, master]

jobs:
  video-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start server
        run: |
          sed -i '/gpus: all/d' docker-compose.yml
          docker compose up --build -d

      - name: Wait for Triton server to be ready
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:18000/v2/health/ready; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown
          gdown https://drive.google.com/uc?id=14oplAtMYRqmGexvrG72q46b6Rytrgwhk
          uv run pytest tests
        env:
          SERVER_URL: 0.0.0.0:18000
          VIDEO_PATH: car_video.mp4
