[project]
name = "triton-tutorial"
version = "0.1.0"
description = "Minimal demo of Triton Inference Server with the Python backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless",
    "numpy",
    "tritonclient[http,grpc]",
    "easyocr",
    "torch==2.7.1",
    "transformers>=4.56.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
]

[tool.uv]
package = false
